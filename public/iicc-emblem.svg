<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="embGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFBA68"/>
      <stop offset="35%" stop-color="#C59B3F"/>
      <stop offset="70%" stop-color="#F3E2A9"/>
      <stop offset="100%" stop-color="#A57D28"/>
    </linearGradient>
    <linearGradient id="embBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2DFAB"/>
      <stop offset="50%" stop-color="#B89753"/>
      <stop offset="100%" stop-color="#8F6E28"/>
    </linearGradient>
    <radialGradient id="embEmerald" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2D5544"/>
      <stop offset="70%" stop-color="#18362A"/>
      <stop offset="100%" stop-color="#0E231B"/>
    </radialGradient>
    <filter id="embShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g filter="url(#embShadow)">
    <!-- Outer Gold Ring -->
    <circle cx="50" cy="50" r="46" fill="none" stroke="url(#embBorder)" stroke-width="3"/>
    <circle cx="50" cy="50" r="42" fill="none" stroke="#FAF8F5" stroke-width="1.2" opacity="0.6"/>
    
    <!-- Inner Emerald Medallion -->
    <circle cx="50" cy="50" r="40" fill="url(#embEmerald)"/>
    
    <!-- Decorative Inner Beaded Ring -->
    <circle cx="50" cy="50" r="36.5" fill="none" stroke="url(#embGold)" stroke-width="1" stroke-dasharray="3 2.5"/>

    <!-- IPB Dome / Crown / Arch Motif -->
    <path d="M37 35 C37 26, 63 26, 63 35 L63 38 L37 38 Z" fill="url(#embGold)" opacity="0.9"/>
    
    <!-- Laurel Wreath Leaves (Left) -->
    <path d="M26 49 C25 43, 29 36, 33 34 C30 40, 31 46, 33 51 C29 51, 26 53, 26 49 Z" fill="url(#embGold)"/>
    <path d="M28 57 C25 54, 27 48, 32 47 C30 52, 32 57, 36 59 C31 61, 28 59, 28 57 Z" fill="url(#embGold)"/>
    <path d="M33 65 C29 63, 31 58, 36 57 C35 62, 38 66, 42 67 C38 69, 34 68, 33 65 Z" fill="url(#embGold)"/>

    <!-- Laurel Wreath Leaves (Right) -->
    <path d="M74 49 C75 43, 71 36, 67 34 C70 40, 69 46, 67 51 C71 51, 74 53, 74 49 Z" fill="url(#embGold)"/>
    <path d="M72 57 C75 54, 73 48, 68 47 C70 52, 68 57, 64 59 C69 61, 72 59, 72 57 Z" fill="url(#embGold)"/>
    <path d="M67 65 C71 63, 69 58, 64 57 C65 62, 62 66, 58 67 C62 69, 66 68, 67 65 Z" fill="url(#embGold)"/>

    <!-- Center IICC Monogram -->
    <text x="50" y="55" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', Georgia, serif" font-size="22" font-weight="900" fill="url(#embGold)" letter-spacing="2" text-anchor="middle">IICC</text>

    <!-- Star at Top -->
    <polygon points="50,18 51.6,22 56,22.3 52.7,25.3 53.7,29.6 50,27.5 46.3,29.6 47.3,25.3 44,22.3 48.4,22" fill="url(#embGold)"/>
    
    <!-- Base Arch Ribbon -->
    <path d="M38 71 Q50 75 62 71 Q62 76 50 78 Q38 76 38 71 Z" fill="url(#embGold)"/>
  </g>
</svg>
