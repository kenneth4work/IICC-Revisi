<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 76" width="460" height="76" fill="none">
  <defs>
    <!-- Gold Gradients -->
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFBA68"/>
      <stop offset="35%" stop-color="#C59B3F"/>
      <stop offset="70%" stop-color="#F3E2A9"/>
      <stop offset="100%" stop-color="#A57D28"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2DFAB"/>
      <stop offset="50%" stop-color="#B89753"/>
      <stop offset="100%" stop-color="#8F6E28"/>
    </linearGradient>
    <!-- Emerald Green Gradient -->
    <radialGradient id="emeraldBg" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2D5544"/>
      <stop offset="70%" stop-color="#18362A"/>
      <stop offset="100%" stop-color="#0E231B"/>
    </radialGradient>
    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Group 1: Emblem Seal -->
  <g transform="translate(6, 4)" filter="url(#softShadow)">
    <!-- Outer Gold Ring -->
    <circle cx="34" cy="34" r="33" fill="none" stroke="url(#goldBorder)" stroke-width="2.5"/>
    <circle cx="34" cy="34" r="30.5" fill="none" stroke="#FAF8F5" stroke-width="1" opacity="0.6"/>
    
    <!-- Inner Emerald Medallion -->
    <circle cx="34" cy="34" r="29" fill="url(#emeraldBg)"/>
    
    <!-- Decorative Inner Beaded Ring -->
    <circle cx="34" cy="34" r="26.5" fill="none" stroke="url(#goldLinear)" stroke-width="0.75" stroke-dasharray="2 2"/>

    <!-- IPB Dome / Crown / Arch Motif -->
    <path d="M25 24 C25 18, 43 18, 43 24 L43 26 L25 26 Z" fill="url(#goldLinear)" opacity="0.85"/>
    
    <!-- Laurel Wreath Leaves (Left) -->
    <path d="M18 34 C17 30, 20 25, 23 23 C21 27, 21 31, 23 35 C20 35, 18 37, 18 34 Z" fill="url(#goldLinear)"/>
    <path d="M19 39 C17 37, 18 33, 22 32 C21 35, 22 39, 25 41 C21 42, 19 41, 19 39 Z" fill="url(#goldLinear)"/>
    <path d="M23 45 C20 44, 21 40, 25 39 C24 43, 26 46, 29 47 C26 48, 23 47, 23 45 Z" fill="url(#goldLinear)"/>

    <!-- Laurel Wreath Leaves (Right) -->
    <path d="M50 34 C51 30, 48 25, 45 23 C47 27, 47 31, 45 35 C48 35, 50 37, 50 34 Z" fill="url(#goldLinear)"/>
    <path d="M49 39 C51 37, 50 33, 46 32 C47 35, 46 39, 43 41 C47 42, 49 41, 49 39 Z" fill="url(#goldLinear)"/>
    <path d="M45 45 C48 44, 47 40, 43 39 C44 43, 42 46, 39 47 C42 48, 45 47, 45 45 Z" fill="url(#goldLinear)"/>

    <!-- Center IICC Monogram -->
    <g transform="translate(34, 33) text-anchor:middle">
      <text x="0" y="5" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', Georgia, serif" font-size="16" font-weight="900" fill="url(#goldLinear)" letter-spacing="1.5" text-anchor="middle">IICC</text>
    </g>

    <!-- Star at Top -->
    <polygon points="34,11 35.2,14 38.5,14.2 36,16.4 36.8,19.6 34,18 31.2,19.6 32,16.4 29.5,14.2 32.8,14" fill="url(#goldLinear)"/>
    
    <!-- Base Arch Banner -->
    <path d="M26 49 Q34 52 42 49 Q42 53 34 54 Q26 53 26 49 Z" fill="url(#goldLinear)"/>
  </g>

  <!-- Group 2: Typography / Brand Wordmark -->
  <g transform="translate(86, 0)">
    <!-- Primary Title -->
    <text x="0" y="30" font-family="'Cinzel', 'Playfair Display', 'Cormorant Garamond', Georgia, serif" font-size="20" font-weight="800" fill="#1A1E24" letter-spacing="1.2">
      IPB INTERNATIONAL
    </text>
    <text x="0" y="51" font-family="'Cinzel', 'Playfair Display', 'Cormorant Garamond', Georgia, serif" font-size="16.5" font-weight="700" fill="#B89753" letter-spacing="2.8">
      CONVENTION CENTER
    </text>

    <!-- Subtitle Bar / Accreditation -->
    <g transform="translate(0, 64)">
      <line x1="0" y1="-3" x2="360" y2="-3" stroke="#E7E2D7" stroke-width="0.8"/>
      <text x="0" y="7" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#78716C" letter-spacing="2.2">
        BOGOR <tspan fill="#B89753">·</tspan> WHERE PRESTIGE MEETS PURPOSE <tspan fill="#B89753">·</tspan> BLST IPB
      </text>
    </g>
  </g>
</svg>
